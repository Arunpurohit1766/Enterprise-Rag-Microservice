services:
  enterprise-rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-service
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - QDRANT_COLLECTION_NAME=enterprise_knowledge_base
      - QDRANT_STORAGE_PATH=/data/qdrant_storage
    volumes:
      - ./data/qdrant_storage:/data/qdrant_storage
      - /home/vscode/.cache:/home/appuser/.cache
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
