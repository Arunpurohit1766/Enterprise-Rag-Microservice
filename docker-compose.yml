version: '3.8'

services:
  rag-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - QDRANT_USE_IN_MEMORY=True
      - QDRANT_COLLECTION_NAME=enterprise_knowledge_base
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-20b
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
